# API on :8000, dashboard on :8501.   docker compose up -d
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      CLEARMIS_API_KEYS: ${CLEARMIS_API_KEYS:-change-me}
    restart: unless-stopped
  dashboard:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
    restart: unless-stopped
